name: Check solution
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests-and-sample:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends g++ git
          pip install --no-cache-dir -r requirements-dev.txt
      - name: Run Python and actual JavaScript checks
        run: |
          node --version
          python -m pytest -q tests
      - name: Verify clean generated recording
        run: |
          python scripts/make_sample_bag.py work/sample
          python scripts/evaluate.py work --out results/sample
          python -c "import json; r=json.load(open('results/sample/summary.json')); assert r['bags'][0]['event_count']==1"
      - name: Verify portable regression fixture
        run: python scripts/regression_suite.py --help
