# CI/CD of the solution in SourceCraft.
#
#   check    every push to main: unit tests and a detector run on a generated
#            recording (synthetic tunnel, 26-byte points with ring and timestamp)
#   deploy-demo  every push to main: Docker image -> Container Registry -> demo VM
#            in Yandex Cloud (web interface, see deploy/README.md)
#   run-bag  manual run (CI/CD -> "Новый запуск" -> run-bag): the detector on any
#            recording by link (.db3, .zip, .tar, .zst; direct or Yandex Disk);
#            with an empty link - on the generated recording
#
# Reports are published as artifacts of the run (folder results/).
on:
  push:
    - workflows: [check, deploy-demo]
      filter:
        branches: ["main"]

workflows:
  check:
    settings:
      max_cube_duration: 30m
    tasks:
      - name: check
        cubes:
          - name: tests-and-sample-run
            image: docker.io/library/python:3.11-slim
            env:
              OPENBLAS_NUM_THREADS: "1"
              OMP_NUM_THREADS: "1"
            script:
              - pip install --no-cache-dir -q -r requirements-dev.txt
              - mkdir -p results
              # no pipes (| tee) here: a pipe would hide a failing command
              - python -m pytest -q tests > results/tests.txt 2>&1 || { cat results/tests.txt; exit 1; }
              - cat results/tests.txt
              - python scripts/make_sample_bag.py work/sample
              - python -m gabarit run work/sample > results/run.txt
              - cat results/run.txt
              - python scripts/evaluate.py work --out results/eval > results/summary.txt
              - cat results/summary.txt
              - grep -q "events 1," results/summary.txt || { echo "expected exactly one obstacle event"; exit 1; }
            artifacts:
              paths:
                - results

  run-bag:
    inputs:
      bag_url:
        type: string
        required: false
        default: ""
        description: "Ссылка на запись: .db3, .zip, .tar или .zst, прямая или Яндекс Диск. Пусто - синтетическая запись"
    settings:
      max_cube_duration: 60m
      shared: true
    tasks:
      - name: run-bag
        cubes:
          - name: detect
            image: docker.io/library/python:3.11-slim
            env:
              OPENBLAS_NUM_THREADS: "1"
              OMP_NUM_THREADS: "1"
              BAG_URL: ${{ inputs.bag_url }}
              PYTHONUNBUFFERED: "1"
            script:
              - apt-get update -qq && apt-get install -y -qq zstd > /dev/null
              - pip install --no-cache-dir -q -r requirements.txt
              - mkdir -p results
              - |
                if [ -n "$BAG_URL" ]; then
                  python scripts/fetch_bag.py "$BAG_URL" work/bag
                else
                  python scripts/make_sample_bag.py work/bag
                fi
              - python -m gabarit check --data work
              - python scripts/evaluate.py work --out results/eval --progress 100 > results/summary.txt
              - cat results/summary.txt
            artifacts:
              paths:
                - results

  # Yandex Cloud access by an authorized key of the service account gabarit-ci
  # (secret YC_SA_KEY): a service connection sees only the clouds of the
  # organization of this SourceCraft repository.
  deploy-demo:
    settings:
      max_cube_duration: 45m
    tasks:
      - name: build-and-deploy
        env:
          REGISTRY: cr.yandex/crpd9m3qa8n7gkrt5tt6
          IMAGE_NAME: gabarit
          VM_NAME: gabarit-demo
          YC_FOLDER_ID: b1gd0h3nfq9us43uohvo
          # secrets are resolved in task env (documented pattern), cubes read them from env
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          ADMIN_PASSWORD: ${{ secrets.GABARIT_ADMIN_PASSWORD }}
        cubes:
          - name: setup-buildx
            action: docker/setup-buildx-action@v3.11.1

          - name: login
            action: docker/login-action@v3.5.0
            with:
              registry: cr.yandex
              username: json_key
              password: ${{ env.YC_SA_KEY }}

          - name: build-and-push
            action: docker/build-push-action@v6.18.0
            with:
              context: .
              file: Dockerfile
              platforms: linux/amd64
              tags: |
                ${{ env.REGISTRY }}/gabarit:latest
              push: true

          # the VM runs the image by digest: a new digest in the spec makes the
          # VM agent pull the new image and recreate the container
          - name: deploy
            env:
              DIGEST: ${{ cubes.build-and-push.outputs.digest }}
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                set -e
                [ -n "$YC_SA_KEY" ] || { echo "secret YC_SA_KEY is not set"; exit 1; }
                [ -n "$ADMIN_PASSWORD" ] || { echo "secret GABARIT_ADMIN_PASSWORD is not set"; exit 1; }
                printf '%s' "$YC_SA_KEY" > /tmp/sa-key.json
                yc config set service-account-key /tmp/sa-key.json
                yc config set folder-id "$YC_FOLDER_ID"
                rm -f /tmp/sa-key.json
                if [ -z "$DIGEST" ]; then   # fallback: digest of the image tagged latest
                  DIGEST=$(yc container image list --repository-name "${REGISTRY#cr.yandex/}/$IMAGE_NAME" --format yaml                     | awk '/digest:/{d=$2} /- latest/{print d; exit}')
                fi
                [ -n "$DIGEST" ] || { echo "image digest not found"; exit 1; }
                sed -e "s#__IMAGE__#$REGISTRY/$IMAGE_NAME@$DIGEST#"                     -e "s#__ADMIN_PASSWORD__#$ADMIN_PASSWORD#" deploy/docker-compose.yaml > /tmp/compose.yaml
                yc compute instance add-metadata --name "$VM_NAME" --metadata-from-file docker-compose=/tmp/compose.yaml
                echo "deployed $REGISTRY/$IMAGE_NAME@$DIGEST to $VM_NAME"
                yc compute instance get --name "$VM_NAME" --format yaml | awk '/one_to_one_nat:/{f=1} f && /address:/{print "demo: http://" $2; exit}'
