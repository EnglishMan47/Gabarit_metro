# Cloud demo: web interface on a Yandex Cloud VM (Container Optimized Image).
# __IMAGE__ and __ADMIN_PASSWORD__ are filled in by deploy/yc-setup.sh and by
# the SourceCraft CI (.sourcecraft/ci.yaml) on every push to main.
version: '3.7'
services:
  gabarit:
    container_name: gabarit
    image: "__IMAGE__"
    # image of deploy/Dockerfile.web (web interface, no ROS); on the first start
    # a synthetic demo recording with an obstacle is generated
    entrypoint: ["/bin/sh", "-c", "[ -d /data/bags/sample_obstacle ] || python scripts/make_sample_bag.py /data/bags/sample_obstacle; exec python -m web.server --host 0.0.0.0 --port 8000 \"$$@\"", "--"]
    command: ["--data", "/data/bags", "--uploads", "/data/uploads", "--max-users", "1"]
    ports:
      - "80:8000"
    environment:
      GABARIT_ADMIN_PASSWORD: "__ADMIN_PASSWORD__"
    volumes:
      - /var/lib/gabarit/bags:/data/bags                 # recordings copied by deploy/upload-bag.sh
      - /var/lib/gabarit/uploads:/data/uploads           # recordings uploaded from the browser
      - /var/lib/gabarit/artifacts:/opt/gabarit/artifacts  # journal, versions, scan cache
    restart: always
